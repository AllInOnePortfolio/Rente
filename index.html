<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Renté</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renté">
<meta name="theme-color" content="#FBF4E7">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<link rel="icon" id="favicon" href="">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#FBF4E7;
    --bg-outer:#EEE2CC;
    --card:#FFFEFA;
    --beige:#F1E5CC;
    --beige-dark:#B98F68;
    --accent:#7A4B2E;
    --accent-dark:#54331E;
    --text:#3E2A1B;
    --text-soft:#8A7160;
    --text-faint:#BFA98F;
    --line:#EBDFC5;
    --danger:#B0473A;
    --success:#5B8266;
    --radius:22px;
    --radius-sm:14px;
    --tabbar-h:64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241811;
      --bg-outer:#170F0A;
      --card:#2E2018;
      --beige:#3A2A1E;
      --beige-dark:#6B4A34;
      --accent:#D9B48A;
      --accent-dark:#EAD1AE;
      --text:#F5EBDD;
      --text-soft:#C9B49B;
      --text-faint:#8A7161;
      --line:#43312A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241811;
    --bg-outer:#170F0A;
    --card:#2E2018;
    --beige:#3A2A1E;
    --beige-dark:#6B4A34;
    --accent:#D9B48A;
    --accent-dark:#EAD1AE;
    --text:#F5EBDD;
    --text-soft:#C9B49B;
    --text-faint:#8A7161;
    --line:#43312A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg-outer); overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    overflow-wrap:break-word;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{display:none;}

  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.06);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
  }
  #app{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    min-height:0;
  }
  .screen{padding:18px 18px 28px; animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---------- Top bars ---------- */
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .topbar h1{font-size:17px; margin:0; font-weight:600; flex:1; text-align:center; margin-right:34px;}
  .iconbtn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--beige);
    display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .iconbtn svg{width:18px; height:18px;}
  .iconbtn.ghost{background:transparent;}

  /* ---------- Home header ---------- */
  .home-header{padding:20px 18px 6px;}
  .logo-wrap{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .logo{font-family:'Fraunces',Georgia,'Iowan Old Style',serif; font-style:italic; font-size:26px; letter-spacing:0.2px; font-weight:600; color:var(--text);}
  .logo span{color:var(--accent); font-style:normal;}
  .brand-mark{display:flex; align-items:center; gap:9px;}
  .brand-badge{border-radius:50%; background:var(--accent); color:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-badge svg{width:56%; height:56%;}
  .header-actions{display:flex; gap:10px;}
  .badge-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}
  .greeting{font-size:22px; font-weight:700; margin:2px 0 14px;}
  .greeting small{display:block; font-weight:400; font-size:13px; color:var(--text-soft); margin-top:2px;}

  .wallet-chip{
    display:flex; align-items:center; gap:8px; background:var(--beige); border-radius:100px; padding:8px 14px 8px 8px; cursor:pointer;
  }
  .wallet-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .wallet-chip b{font-size:13px;}

  /* ---------- Search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:100px; padding:12px 16px; margin:14px 0 16px; cursor:text;
  }
  .searchbar input{border:none; outline:none; background:transparent; flex:1; font-size:16px; color:var(--text);}
  .searchbar svg{width:18px; height:18px; color:var(--text-soft); flex-shrink:0;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
  .section-title h2{font-size:16px; margin:0; font-weight:700;}
  .section-title a{font-size:12.5px; color:var(--accent-dark); text-decoration:none; font-weight:600;}

  .chips-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin:0 -18px; padding-left:18px; padding-right:18px;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 15px; border-radius:100px;
    background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:600; cursor:pointer; color:var(--text);
  }
  .chip.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .chip .em{font-size:15px;}

  .hscroll{display:flex; gap:14px; overflow-x:auto; margin:0 -18px; padding:2px 18px 10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  /* ---------- Cards ---------- */
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--line);}
  .item-card{width:100%; cursor:pointer; overflow:hidden; position:relative;}
  .hscroll .item-card{width:158px; flex-shrink:0;}
  .item-img{
    position:relative; width:100%; aspect-ratio:1/1.05; display:flex; align-items:center; justify-content:center;
    font-size:44px; overflow:hidden;
  }
  .item-img img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .fav-btn{
    position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
    color:#B0392E; font-size:15px; cursor:pointer; z-index:2;
  }
  .fav-btn.active{color:#C1392B;}
  .badge-trend{position:absolute; left:9px; top:9px; background:rgba(46,42,37,0.82); color:#fff; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:100px; z-index:2;}
  .item-info{padding:11px 12px 13px;}
  .item-title{font-size:13.5px; font-weight:700; line-height:1.25; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-meta{font-size:11.5px; color:var(--text-soft); margin-bottom:6px;}
  .item-price{font-size:13.5px; margin-bottom:6px;}
  .item-price b{font-size:15px;}
  .item-owner{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-soft);}
  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex-shrink:0;}
  .list-row{display:flex; gap:12px; padding:12px; cursor:pointer; align-items:center;}
  .list-row .item-img{width:64px; height:64px; border-radius:16px; flex-shrink:0; font-size:26px; aspect-ratio:auto;}
  .list-row .rowinfo{flex:1; min-width:0;}

  .stars{color:var(--accent-dark); font-size:11px; letter-spacing:1px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:16px;
    border:none; font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn-primary{background:var(--text); color:var(--bg);}
  .btn-primary:disabled{opacity:0.4;}
  .btn-outline{background:transparent; border:1.5px solid var(--text); color:var(--text);}
  .btn-beige{background:var(--beige); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn-sm{padding:10px; font-size:13px; border-radius:12px; width:auto; flex:1;}
  .btn-row{display:flex; gap:10px; margin-top:10px;}
  .sticky-cta{position:sticky; bottom:0; padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px)); background:linear-gradient(0deg, var(--bg) 60%, transparent); z-index:4;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.4px;}
  .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=date], .field textarea, .field select{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-size:16px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:80px;}
  .row2{display:flex; gap:12px;}
  .row2 .field{flex:1;}
  .tagpick{display:flex; flex-wrap:wrap; gap:8px;}
  .tagpick .chip{margin:0;}

  /* ---------- Tabbar ---------- */
  .tabbar{
    display:flex; flex-shrink:0; background:var(--card); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:6px 2px;
    color:var(--text-faint); cursor:pointer; position:relative;
  }
  .tab svg{width:22px; height:22px;}
  .tab span{font-size:10px; font-weight:600;}
  .tab.active{color:var(--text);}
  .tab.plus .plusdot{
    width:38px; height:38px; border-radius:50%; background:var(--text); color:var(--bg); display:flex; align-items:center; justify-content:center; margin-bottom:2px;
  }
  .tab.plus svg{width:18px; height:18px;}

  /* ---------- Misc ---------- */
  .empty{text-align:center; padding:50px 20px; color:var(--text-soft);}
  .empty .em{font-size:40px; display:block; margin-bottom:12px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .pill{display:inline-flex; align-items:center; padding:5px 11px; border-radius:100px; background:var(--beige); font-size:12px; font-weight:600;}
  .pill.status-requested{background:#F2E4C8; color:#8A6A1E;}
  .pill.status-confirmed{background:#DCEBE0; color:#3D6B4C;}
  .pill.status-active{background:#DDE7F2; color:#33587E;}
  .pill.status-return_pending{background:#F2E1D8; color:#93502E;}
  .pill.status-completed{background:var(--beige); color:var(--text-soft);}
  .pill.status-declined, .pill.status-cancelled{background:#F3DCD8; color:#A03B2E;}
  .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; color:var(--text-soft);}
  .kv b{color:var(--text); font-weight:700;}
  .steps{display:flex; gap:6px; margin-bottom:18px;}
  .steps div{flex:1; height:4px; border-radius:100px; background:var(--line);}
  .steps div.done{background:var(--text);}
  .radio-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; cursor:pointer;}
  .radio-row.sel{border-color:var(--text); background:var(--beige);}
  .radio-row .rdot{width:18px; height:18px; border-radius:50%; border:2px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .radio-row.sel .rdot{border-color:var(--text);}
  .radio-row.sel .rdot::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--text);}
  .photo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:6px;}
  .photo-slot{aspect-ratio:1/1; border-radius:14px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:var(--card); cursor:pointer;}
  .photo-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .photo-slot .rm{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:11px; z-index:2;}
  .msg-bubble{max-width:78%; padding:10px 14px; border-radius:18px; margin-bottom:10px; font-size:14px; line-height:1.4;}
  .msg-them{background:var(--beige); border-bottom-left-radius:5px;}
  .msg-me{background:var(--text); color:var(--bg); margin-left:auto; border-bottom-right-radius:5px;}
  .msg-time{font-size:10px; color:var(--text-faint); margin:2px 4px 12px; text-align:right;}
  .chatbar{display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--bg);}
  .chatbar input{flex:1; border:1.5px solid var(--line); border-radius:100px; padding:12px 16px; outline:none; background:var(--card); color:var(--text); font-size:16px;}
  .chatbar button{width:44px; height:44px; border-radius:50%; background:var(--text); color:var(--bg); border:none; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .notif-row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
  .notif-row .em{width:38px; height:38px; border-radius:50%; background:var(--beige); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
  .notif-row.unread{position:relative;}
  .notif-row.unread::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); position:absolute; right:0; top:16px;}
  .profile-tabs{display:flex; gap:6px; background:var(--beige); padding:4px; border-radius:14px; margin:16px 0;}
  .profile-tabs button{flex:1; padding:9px; border:none; background:transparent; border-radius:11px; font-size:12.5px; font-weight:700; color:var(--text-soft); cursor:pointer;}
  .profile-tabs button.active{background:var(--card); color:var(--text);}
  .stat-box{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px;}
  .stat-box b{display:block; font-size:18px;}
  .stat-box span{font-size:11px; color:var(--text-soft);}
  .review{padding:14px 0; border-bottom:1px solid var(--line);}
  .review-head{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg);
    padding:12px 20px; border-radius:100px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:999; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:0;}
  .carousel .slide{min-width:100%; scroll-snap-align:start; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:80px; position:relative;}
  .carousel .slide img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .dots{display:flex; gap:5px; justify-content:center; margin-top:10px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .dots span.on{background:var(--text);}
  .verified{display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--success); font-weight:700;}
  .link{color:var(--accent-dark); font-weight:700; cursor:pointer;}
  .center-col{display:flex; flex-direction:column; align-items:center; text-align:center;}

  /* ---------- Desktop ---------- */
  @media (min-width:860px){
    body{display:flex; justify-content:center; padding:0;}
    #root{
      max-width:1180px; width:92vw; height:92vh; min-height:620px; margin:4vh auto;
      border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,0.18);
    }
    #tabbar{
      order:-1; border-top:none; border-bottom:1px solid var(--line);
      padding:12px 28px; justify-content:center; gap:10px;
    }
    .tab{flex:0 0 auto; flex-direction:row; gap:9px; padding:10px 20px; border-radius:100px; transition:background .15s;}
    .tab:hover, .tab.active{background:var(--beige);}
    .tab span{font-size:12.5px;}
    .tab.plus{flex-direction:row;}
    .tab.plus .plusdot{width:28px; height:28px; margin-bottom:0;}
    .home-header, .screen, .sticky-cta, .chatbar{max-width:860px; margin-left:auto; margin-right:auto;}
    .carousel{max-width:860px; margin:0 auto; border-radius:20px; overflow:hidden;}
    .carousel .slide{aspect-ratio:16/10;}
    .grid2{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
    .hscroll .item-card{width:200px;}
  }
</style>
</head>

<script>
/* ===================== DATA LAYER ===================== */
const DB_KEY='rente_db_v2';

/* ===================== COMMUNITY SYNC (Firebase) ===================== */
// Paste your Firebase project's config below (Project settings → General → Your apps → SDK setup and configuration).
// These values are meant to be public in client code — access is controlled by the database's security rules, not by hiding this config.
const FIREBASE_CONFIG={
  apiKey:"",
  databaseURL:"",
  projectId:"",
};
let fbItemsRef=null, fbSynced=false;
if(FIREBASE_CONFIG.databaseURL){
  firebase.initializeApp(FIREBASE_CONFIG);
  fbItemsRef=firebase.database().ref('items');
}
function startCommunitySync(){
  if(!fbItemsRef||fbSynced) return;
  fbSynced=true;
  fbItemsRef.on('value',snap=>{
    if(!db) return;
    const remote=snap.val()||{};
    Object.keys(db.items).forEach(id=>{ if(db.items[id].shared&&!remote[id]) delete db.items[id]; });
    Object.keys(remote).forEach(id=>{
      const it=remote[id]; it.id=id; it.shared=true;
      db.items[id]=it;
      if(!db.users[it.ownerId]){

const POINT_TIERS=[
  {name:'Bronze',min:0,perk:'Welcome perks'},
  {name:'Silver',min:200,perk:'5% off service fees'},
  {name:'Gold',min:500,perk:'Priority support & featured listings'},
  {name:'Platinum',min:1000,perk:'Zero service fees'},
];
function pointsTier(p){
  let idx=0; for(let i=0;i<POINT_TIERS.length;i++){ if(p>=POINT_TIERS[i].min) idx=i; }
  const cur=POINT_TIERS[idx], next=POINT_TIERS[idx+1];
  const pct=next?Math.min(100,Math.round((p-cur.min)/(next.min-cur.min)*100)):100;
  return {cur,next,pct};
}

let storageOK=true;
function saveDB(){
  try{ localStorage.setItem(DB_KEY,JSON.stringify(db)); }
  catch(e){ if(storageOK){ storageOK=false; console.warn('Renté: local storage unavailable, changes will not persist.',e); } }
}
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw){
      db=JSON.parse(raw);
      if(db.points==null) db.points=120;
      if(db.me==='u_me') return false; // old pre-sync demo data — reseed with a real anon id
      return true;
    }
    return false;
  }catch(e){ storageOK=false; console.warn('Renté: local storage unavailable, starting a fresh in-memory session.',e); return false; }
}

function replace(route,params){params=params||{}; state.history[state.history.length-1]={route,params}; state.route=route; state.params=params; render();}

const TAB_ROUTES=['home','search','inbox','profile'];

function render(){
  const app=document.getElementById('app');
  const r=state.route,p=state.params;
  let html='';
  try{
    if(r==='onboarding') html=screenOnboarding();
    else if(r==='home') html=screenHome();

    else if(r==='item') html=screenItemDetail(p.id);
    else if(r==='booking') html=screenBooking(p.id,p.step||1);
    else if(r==='booking-detail') html=screenBookingDetail(p.id);
    else if(r==='list-create') html=screenListCreate();
    else if(r==='edit-item') html=screenEditItem(p.id);

    else if(r==='chat') html=screenChat(p.threadId);
    else if(r==='wallet') html=screenWallet();

    else if(r==='favorites') html=screenFavorites();

function screenBooking(itemId,step){
  const item=db.items[itemId]; const owner=db.users[item.ownerId];
  if(!state.bookingDraft||state.bookingDraft.itemId!==itemId){

  }
  const d=state.bookingDraft;

  const total=subtotal+item.deposit;
  let body='';
  if(step===1){
    body=`
    <div class="field"><label>Pickup date</label><input type="date" value="${d.start}" min="${item.availFrom}" max="${item.availTo}" onchange="state.bookingDraft.start=this.value;render()"></div>
    <div class="field"><label>Return date</label><input type="date" value="${d.end}" min="${d.start}" max="${item.availTo}" onchange="state.bookingDraft.end=this.value;render()"></div>

    <div class="sticky-cta" style="position:static;padding:20px 0 0;"><button class="btn btn-primary" onclick="go('booking',{id:'${itemId}',step:2})">Continue</button></div>`;

    body=`

    ${SPOTS.map(s=>`
      <div class="radio-row ${d.spot===s.id?'sel':''}" onclick="state.bookingDraft.spot='${s.id}';render()">
        <div class="rdot"></div><div style="font-size:14px;font-weight:600;">${esc(s.name)}</div>
      </div>`).join('')}
    <div class="sticky-cta" style="position:static;padding:20px 0 0;"><button class="btn btn-primary" ${!d.spot?'disabled':''} onclick="go('booking',{id:'${itemId}',step:3})">Continue</button></div>`;

    body=`
    <div class="card" style="padding:16px;margin-bottom:16px;">
      <div class="kv"><span>${esc(item.title)}</span><b>${days}d</b></div>
      <div class="kv"><span>${fmtDate(d.start)} → ${fmtDate(d.end)}</span></div>
      <div class="kv"><span>Meetup spot</span><b>${esc(spot?spot.name:'—')}</b></div>
      <div class="divider"></div>
      <div class="kv"><span>Rental (${days} × ${fmtKr(item.price)})</span><b>${fmtKr(subtotal)}</b></div>
      <div class="kv"><span>Refundable damage deposit</span><b>${fmtKr(item.deposit)}</b></div>
      <div class="divider"></div>
      <div class="kv" style="font-size:16px;"><span><b>Total due now</b></span><b>${fmtKr(total)}</b></div>
    </div>

    ${insufficient?`<div class="pill status-declined" style="margin-bottom:14px;">Insufficient wallet balance — <span class="link" onclick="go('wallet')">top up</span></div>`:''}
    <div class="sticky-cta" style="position:static;padding:0;"><button class="btn btn-primary" ${insufficient?'disabled':''} onclick="confirmBooking('${itemId}')">Confirm & Pay ${fmtKr(total)}</button></div>`;
  }

  ${topbar('Rent item')}

    <div class="steps"><div class="${step>=1?'done':''}"></div><div class="${step>=2?'done':''}"></div><div class="${step>=3?'done':''}"></div></div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:18px;">

      <div><div style="font-weight:700;font-size:14px;">${esc(item.title)}</div><div style="font-size:12px;color:var(--text-soft);">${fmtKr(item.price)}/day · Owner ${esc(owner.name.split(' ')[0])}</div></div>

function confirmBooking(itemId){
  const item=db.items[itemId]; const d=state.bookingDraft; const days=daysBetween(d.start,d.end);
  const price=days*item.price; const spot=SPOTS.find(s=>s.id===d.spot);
  const bk={id:uid('bk'),itemId,renterId:db.me,ownerId:item.ownerId,status:'requested',start:d.start,end:d.end,meetup:spot.name,price,deposit:item.deposit,createdAt:new Date().toISOString(),returnPhotos:[]};
  db.bookings[bk.id]=bk;
  db.wallet.balance-=(price+item.deposit);
  db.wallet.transactions.push({id:uid('tx'),type:'rental_payment',amount:-price,desc:'Rental payment — '+item.title,time:new Date().toISOString()});
  db.wallet.transactions.push({id:uid('tx'),type:'deposit_hold',amount:-item.deposit,desc:'Deposit hold — '+item.title,time:new Date().toISOString()});
  db.notifications.unshift({id:uid('nt'),type:'booking',text:'Request sent to '+db.users[item.ownerId].name+' for '+item.title+'.',time:new Date().toISOString(),read:false,route:{r:'booking-detail',p:{id:bk.id}}});
  saveDB();
  setTimeout(()=>{ // simulate owner auto-accept
    const b=db.bookings[bk.id]; if(b&&b.status==='requested'){ b.status='confirmed';
      db.notifications.unshift({id:uid('nt'),type:'booking',text:db.users[item.ownerId].name+' confirmed your booking for '+item.title+'.',time:new Date().toISOString(),read:false,route:{r:'booking-detail',p:{id:bk.id}}});
      saveDB(); if(state.route==='booking-detail'&&state.params.id===bk.id) render();
    }
  },2000);
  state.bookingDraft=null;
  toast('Booking request sent!');
  go('booking-detail',{id:bk.id});
}

/* ===================== BOOKING DETAIL / TRACKING ===================== */
function screenBookingDetail(id){
  const b=db.bookings[id]; if(!b) return `<div class="screen">${topbar('Booking')}<div class="empty">Not found</div></div>`;
  const item=db.items[b.itemId]; const isOwnerView=b.ownerId===db.me;
  const other=db.users[isOwnerView?b.renterId:b.ownerId];
  const statusLabel={requested:'Requested',confirmed:'Confirmed',active:'Active',return_pending:'Awaiting confirmation',completed:'Completed',declined:'Declined',cancelled:'Cancelled'}[b.status];
  let actions='';
  if(isOwnerView){
    if(b.status==='requested') actions=`<div class="btn-row"><button class="btn btn-danger btn-sm" onclick="declineBooking('${id}')">Decline</button><button class="btn btn-primary btn-sm" onclick="acceptBooking('${id}')">Accept</button></div>`;
    else if(b.status==='return_pending') actions=`<button class="btn btn-primary" onclick="confirmReturn('${id}')">Confirm condition & refund deposit</button>`;
  } else {
    if(b.status==='requested') actions=`<div style="font-size:13px;color:var(--text-soft);margin-bottom:10px;">Waiting for ${esc(other.name.split(' ')[0])} to confirm…</div><button class="btn btn-danger" onclick="cancelBooking('${id}')">Cancel request</button>`;
    else if(b.status==='confirmed') actions=`<button class="btn btn-primary" onclick="markPickedUp('${id}')">Mark as picked up</button>`;
    else if(b.status==='active') actions=`<button class="btn btn-primary" onclick="markReturned('${id}')">Mark as returned</button>`;
    else if(b.status==='return_pending') actions=`<div style="font-size:13px;color:var(--text-soft);">Waiting for ${esc(other.name.split(' ')[0])} to confirm return and refund your deposit.</div>`;
  }
  return `
  ${topbar('Booking details')}
  <div class="screen">
    <div class="card list-row" style="margin-bottom:16px;" onclick="go('item',{id:'${item.id}'})">
      <div class="item-img" style="width:60px;height:60px;border-radius:14px;background:${placeholderGrad(item.category)};font-size:26px;">${(item.images&&item.images[0]!=='placeholder')?`<img src="${item.images[0]}">`:catEmoji(item.category)}</div>
      <div class="rowinfo"><div class="item-title">${esc(item.title)}</div><div class="item-meta">${fmtDate(b.start)} – ${fmtDate(b.end)}</div></div>
    </div>
    <span class="pill status-${b.status}">${statusLabel}</span>
    <div class="card" style="padding:14px;margin:14px 0;">
      <div class="kv"><span>${isOwnerView?'Renter':'Owner'}</span><b>${esc(other.name)}</b></div>
      <div class="kv"><span>Meetup spot</span><b>${esc(b.meetup)}</b></div>
      <div class="kv"><span>Rental price</span><b>${fmtKr(b.price)}</b></div>
      <div class="kv"><span>Damage deposit</span><b>${fmtKr(b.deposit)}</b></div>
    </div>
    <button class="btn btn-beige" style="margin-bottom:16px;" onclick="openChatWith('${other.id}','${item.id}')">💬 Message ${esc(other.name.split(' ')[0])}</button>
    ${actions}
  </div>`;
}
function findBookingThreadCtx(id){return id;}
function acceptBooking(id){const b=db.bookings[id]; b.status='confirmed'; db.notifications.unshift({id:uid('nt'),type:'booking',text:'You confirmed the booking for '+db.items[b.itemId].title+'.',time:new Date().toISOString(),read:true}); saveDB(); toast('Booking accepted'); render();}
function declineBooking(id){const b=db.bookings[id]; const item=db.items[b.itemId]; b.status='declined';
  db.wallet.transactions.push({id:uid('tx'),type:'refund',amount:b.price+b.deposit,desc:'Refund — '+item.title+' (declined)',time:new Date().toISOString()});
  db.wallet.balance+=b.price+b.deposit; saveDB(); toast('Booking declined & renter refunded'); render();}
function cancelBooking(id){const b=db.bookings[id]; const item=db.items[b.itemId]; b.status='cancelled';
  db.wallet.transactions.push({id:uid('tx'),type:'refund',amount:b.price+b.deposit,desc:'Refund — '+item.title+' (cancelled)',time:new Date().toISOString()});
  db.wallet.balance+=b.price+b.deposit; saveDB(); toast('Request cancelled & refunded'); render();}
function markPickedUp(id){const b=db.bookings[id]; b.status='active'; saveDB(); toast('Enjoy your rental!'); render();}
function markReturned(id){const b=db.bookings[id]; b.status='return_pending'; saveDB(); toast('Marked as returned'); render();
  setTimeout(()=>{const bb=db.bookings[id]; if(bb&&bb.status==='return_pending'&&bb.ownerId!==db.me){
    const item=db.items[bb.itemId];
    bb.status='completed';
    db.wallet.transactions.push({id:uid('tx'),type:'deposit_refund',amount:bb.deposit,desc:'Deposit refunded — '+item.title,time:new Date().toISOString()});
    db.wallet.balance+=bb.deposit;
    db.notifications.unshift({id:uid('nt'),type:'payment',text:db.users[bb.ownerId].name+' confirmed your return. Deposit refunded!',time:new Date().toISOString(),read:false});
    saveDB(); if(state.route==='booking-detail'&&state.params.id===id) render();
  }},2500);
}
function confirmReturn(id){const b=db.bookings[id]; const item=db.items[b.itemId]; b.status='completed';
  db.wallet.transactions.push({id:uid('tx'),type:'deposit_refund_out',amount:0,desc:'Confirmed return — '+item.title,time:new Date().toISOString()});
  db.wallet.transactions.push({id:uid('tx'),type:'earning',amount:b.price,desc:'Earnings — '+item.title,time:new Date().toISOString()});
  db.wallet.balance+=b.price;
  db.notifications.unshift({id:uid('nt'),type:'payment',text:'You earned '+fmtKr(b.price)+' from '+item.title+'.',time:new Date().toISOString(),read:true});
  saveDB(); toast('Return confirmed — earnings added to wallet'); render();
}

    else if(state.camTarget==='avatar'){ state.profileDraft.avatarPhoto=url; render(); }
  });
  e.target.value='';
});
function fileToDataURL(file,maxDim,quality){
  maxDim=maxDim||1000; quality=quality||0.72;
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function sendMsg(threadId){
  const inp=document.getElementById('chat-input'); const text=inp.value.trim(); if(!text) return;

  setTimeout(()=>{

    t.messages.push({from:otherId,text:txt,time:new Date().toISOString()});

  },1300);
}

    </div>`:''}
    ${content}
    ${isMe?`<div class="divider"></div><button class="btn btn-outline" onclick="resetDemo()">Reset demo data</button>`:''}
  </div>`;
}
function bookingList(list,isOwnerView){
  if(!list.length) return '<div class="empty">Nothing here yet</div>';
  const statusLabel={requested:'Requested',confirmed:'Confirmed',active:'Active',return_pending:'Awaiting confirmation',completed:'Completed',declined:'Declined',cancelled:'Cancelled'};
  return list.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(b=>{
    const item=db.items[b.itemId]; if(!item) return '';
    const other=db.users[isOwnerView?b.renterId:b.ownerId];
    return `<div class="card list-row" style="margin-bottom:10px;" onclick="go('booking-detail',{id:'${b.id}'})">
      <div class="item-img" style="width:50px;height:50px;border-radius:12px;background:${placeholderGrad(item.category)};font-size:22px;">${(item.images&&item.images[0]!=='placeholder')?`<img src="${item.images[0]}">`:catEmoji(item.category)}</div>
      <div class="rowinfo"><div class="item-title">${esc(item.title)}</div><div class="item-meta">${isOwnerView?'Renter':'Owner'}: ${esc(other.name.split(' ')[0])} · ${fmtDate(b.start)}</div><span class="pill status-${b.status}" style="margin-top:4px;">${statusLabel[b.status]}</span></div>
    </div>`;
  }).join('');
}
function resetDemo(){ if(confirm('This clears all local demo data on this device. Continue?')){ localStorage.removeItem(DB_KEY); location.reload(); } }

/* ===================== EDIT PROFILE ===================== */
function screenEditProfile(){
  const u=me();
  if(!state.profileDraft) state.profileDraft={name:u.name,program:u.program,email:u.email||'',bio:u.bio,avatarPhoto:u.avatarPhoto||null};
  const d=state.profileDraft;
  return `
  ${topbar('Edit profile')}
  <div class="screen">
    <div class="center-col" style="margin-bottom:18px;">
      <div style="position:relative;">${avatarHtml({id:u.id,name:d.name,color:u.color,avatarPhoto:d.avatarPhoto},84)}<button class="iconbtn" style="position:absolute;bottom:-2px;right:-2px;background:var(--text);color:var(--bg);" onclick="state.camTarget='avatar';document.getElementById('hiddenCam').click();">📷</button></div>
    </div>
    <div class="field"><label>Full name</label><input type="text" id="e-name" value="${esc(d.name)}" oninput="state.profileDraft.name=this.value"></div>
    <div class="field"><label>Program</label><input type="text" id="e-program" value="${esc(d.program)}" oninput="state.profileDraft.program=this.value"></div>
    <div class="field"><label>University email</label><input type="email" id="e-email" value="${esc(d.email)}" placeholder="you@ju.se" oninput="state.profileDraft.email=this.value"></div>
    <div class="field"><label>Bio</label><textarea id="e-bio" oninput="state.profileDraft.bio=this.value">${esc(d.bio)}</textarea></div>
    <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
  </div>`;
}
function saveProfile(){
  const u=me(); const d=state.profileDraft;
  u.name=d.name.trim()||u.name;
  u.program=d.program.trim()||u.program;
  u.email=d.email.trim();
  u.verified=!!(u.email&&u.email.includes('ju.se'));
  u.bio=d.bio.trim();
  u.avatarPhoto=d.avatarPhoto;
  state.profileDraft=null;
  saveDB(); toast('Profile updated'); go('profile',{userId:db.me});
}
