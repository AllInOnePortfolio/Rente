<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Renté</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renté">
<meta name="theme-color" content="#FBF4E7">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#FBF4E7;
    --bg-outer:#EEE2CC;
    --card:#FFFEFA;
    --beige:#F1E5CC;
    --beige-dark:#B98F68;
    --accent:#7A4B2E;
    --accent-dark:#54331E;
    --text:#3E2A1B;
    --text-soft:#8A7160;
    --text-faint:#BFA98F;
    --line:#EBDFC5;
    --danger:#B0473A;
    --success:#5B8266;
    --radius:22px;
    --radius-sm:14px;
    --tabbar-h:64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241811;
      --bg-outer:#170F0A;
      --card:#2E2018;
      --beige:#3A2A1E;
      --beige-dark:#6B4A34;
      --accent:#D9B48A;
      --accent-dark:#EAD1AE;
      --text:#F5EBDD;
      --text-soft:#C9B49B;
      --text-faint:#8A7161;
      --line:#43312A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241811;
    --bg-outer:#170F0A;
    --card:#2E2018;
    --beige:#3A2A1E;
    --beige-dark:#6B4A34;
    --accent:#D9B48A;
    --accent-dark:#EAD1AE;
    --text:#F5EBDD;
    --text-soft:#C9B49B;
    --text-faint:#8A7161;
    --line:#43312A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg-outer);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{display:none;}

  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.06);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
  }
  #app{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    min-height:0;
  }
  .screen{padding:18px 18px 28px; animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---------- Top bars ---------- */
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .topbar h1{font-size:17px; margin:0; font-weight:600; flex:1; text-align:center; margin-right:34px;}
  .iconbtn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--beige);
    display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .iconbtn svg{width:18px; height:18px;}
  .iconbtn.ghost{background:transparent;}

  /* ---------- Home header ---------- */
  .home-header{padding:20px 18px 6px;}
  .logo-wrap{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .logo{font-family:Georgia,'Iowan Old Style',serif; font-size:26px; letter-spacing:0.5px; font-weight:700; color:var(--text);}
  .logo span{color:var(--accent);}
  .logo-img{display:block; mix-blend-mode:multiply;}
  :root[data-theme="dark"] .logo-img{mix-blend-mode:normal; border-radius:14px;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-img{mix-blend-mode:normal; border-radius:14px;}}
  .header-actions{display:flex; gap:10px;}
  .badge-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}
  .greeting{font-size:22px; font-weight:700; margin:2px 0 14px;}
  .greeting small{display:block; font-weight:400; font-size:13px; color:var(--text-soft); margin-top:2px;}

  .wallet-chip{
    display:flex; align-items:center; gap:8px; background:var(--beige); border-radius:100px; padding:8px 14px 8px 8px; cursor:pointer;
  }
  .wallet-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .wallet-chip b{font-size:13px;}

  /* ---------- Search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:100px; padding:12px 16px; margin:14px 0 16px; cursor:text;
  }
  .searchbar input{border:none; outline:none; background:transparent; flex:1; font-size:15px; color:var(--text);}
  .searchbar svg{width:18px; height:18px; color:var(--text-soft); flex-shrink:0;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
  .section-title h2{font-size:16px; margin:0; font-weight:700;}
  .section-title a{font-size:12.5px; color:var(--accent-dark); text-decoration:none; font-weight:600;}

  .chips-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin:0 -18px; padding-left:18px; padding-right:18px;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 15px; border-radius:100px;
    background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:600; cursor:pointer; color:var(--text);
  }
  .chip.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .chip .em{font-size:15px;}

  .hscroll{display:flex; gap:14px; overflow-x:auto; margin:0 -18px; padding:2px 18px 10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  /* ---------- Cards ---------- */
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--line);}
  .item-card{width:100%; cursor:pointer; overflow:hidden; position:relative;}
  .hscroll .item-card{width:158px; flex-shrink:0;}
  .item-img{
    position:relative; width:100%; aspect-ratio:1/1.05; display:flex; align-items:center; justify-content:center;
    font-size:44px; overflow:hidden;
  }
  .item-img img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .fav-btn{
    position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
    color:#B0392E; font-size:15px; cursor:pointer; z-index:2;
  }
  .fav-btn.active{color:#C1392B;}
  .badge-trend{position:absolute; left:9px; top:9px; background:rgba(46,42,37,0.82); color:#fff; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:100px; z-index:2;}
  .item-info{padding:11px 12px 13px;}
  .item-title{font-size:13.5px; font-weight:700; line-height:1.25; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-meta{font-size:11.5px; color:var(--text-soft); margin-bottom:6px;}
  .item-price{font-size:13.5px; margin-bottom:6px;}
  .item-price b{font-size:15px;}
  .item-owner{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-soft);}
  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex-shrink:0;}
  .list-row{display:flex; gap:12px; padding:12px; cursor:pointer; align-items:center;}
  .list-row .item-img{width:64px; height:64px; border-radius:16px; flex-shrink:0; font-size:26px; aspect-ratio:auto;}
  .list-row .rowinfo{flex:1; min-width:0;}

  .stars{color:var(--accent-dark); font-size:11px; letter-spacing:1px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:16px;
    border:none; font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn-primary{background:var(--text); color:var(--bg);}
  .btn-primary:disabled{opacity:0.4;}
  .btn-outline{background:transparent; border:1.5px solid var(--text); color:var(--text);}
  .btn-beige{background:var(--beige); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn-sm{padding:10px; font-size:13px; border-radius:12px; width:auto; flex:1;}
  .btn-row{display:flex; gap:10px; margin-top:10px;}
  .sticky-cta{position:sticky; bottom:0; padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px)); background:linear-gradient(0deg, var(--bg) 60%, transparent); z-index:4;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.4px;}
  .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=date], .field textarea, .field select{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-size:15px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:80px;}
  .row2{display:flex; gap:12px;}
  .row2 .field{flex:1;}
  .tagpick{display:flex; flex-wrap:wrap; gap:8px;}
  .tagpick .chip{margin:0;}

  /* ---------- Tabbar ---------- */
  .tabbar{
    display:flex; flex-shrink:0; background:var(--card); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:6px 2px;
    color:var(--text-faint); cursor:pointer; position:relative;
  }
  .tab svg{width:22px; height:22px;}
  .tab span{font-size:10px; font-weight:600;}
  .tab.active{color:var(--text);}
  .tab.plus .plusdot{
    width:38px; height:38px; border-radius:50%; background:var(--text); color:var(--bg); display:flex; align-items:center; justify-content:center; margin-bottom:2px;
  }
  .tab.plus svg{width:18px; height:18px;}

  /* ---------- Misc ---------- */
  .empty{text-align:center; padding:50px 20px; color:var(--text-soft);}
  .empty .em{font-size:40px; display:block; margin-bottom:12px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .pill{display:inline-flex; align-items:center; padding:5px 11px; border-radius:100px; background:var(--beige); font-size:12px; font-weight:600;}
  .pill.status-requested{background:#F2E4C8; color:#8A6A1E;}
  .pill.status-confirmed{background:#DCEBE0; color:#3D6B4C;}
  .pill.status-active{background:#DDE7F2; color:#33587E;}
  .pill.status-return_pending{background:#F2E1D8; color:#93502E;}
  .pill.status-completed{background:var(--beige); color:var(--text-soft);}
  .pill.status-declined, .pill.status-cancelled{background:#F3DCD8; color:#A03B2E;}
  .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; color:var(--text-soft);}
  .kv b{color:var(--text); font-weight:700;}
  .steps{display:flex; gap:6px; margin-bottom:18px;}
  .steps div{flex:1; height:4px; border-radius:100px; background:var(--line);}
  .steps div.done{background:var(--text);}
  .radio-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; cursor:pointer;}
  .radio-row.sel{border-color:var(--text); background:var(--beige);}
  .radio-row .rdot{width:18px; height:18px; border-radius:50%; border:2px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .radio-row.sel .rdot{border-color:var(--text);}
  .radio-row.sel .rdot::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--text);}
  .photo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:6px;}
  .photo-slot{aspect-ratio:1/1; border-radius:14px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:var(--card); cursor:pointer;}
  .photo-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .photo-slot .rm{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:11px; z-index:2;}
  .msg-bubble{max-width:78%; padding:10px 14px; border-radius:18px; margin-bottom:10px; font-size:14px; line-height:1.4;}
  .msg-them{background:var(--beige); border-bottom-left-radius:5px;}
  .msg-me{background:var(--text); color:var(--bg); margin-left:auto; border-bottom-right-radius:5px;}
  .msg-time{font-size:10px; color:var(--text-faint); margin:2px 4px 12px; text-align:right;}
  .chatbar{display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--bg);}
  .chatbar input{flex:1; border:1.5px solid var(--line); border-radius:100px; padding:12px 16px; outline:none; background:var(--card); color:var(--text); font-size:14px;}
  .chatbar button{width:44px; height:44px; border-radius:50%; background:var(--text); color:var(--bg); border:none; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .notif-row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
  .notif-row .em{width:38px; height:38px; border-radius:50%; background:var(--beige); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
  .notif-row.unread{position:relative;}
  .notif-row.unread::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); position:absolute; right:0; top:16px;}
  .profile-tabs{display:flex; gap:6px; background:var(--beige); padding:4px; border-radius:14px; margin:16px 0;}
  .profile-tabs button{flex:1; padding:9px; border:none; background:transparent; border-radius:11px; font-size:12.5px; font-weight:700; color:var(--text-soft); cursor:pointer;}
  .profile-tabs button.active{background:var(--card); color:var(--text);}
  .stat-box{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px;}
  .stat-box b{display:block; font-size:18px;}
  .stat-box span{font-size:11px; color:var(--text-soft);}
  .review{padding:14px 0; border-bottom:1px solid var(--line);}
  .review-head{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg);
    padding:12px 20px; border-radius:100px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:999; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius:0;}
  .carousel .slide{min-width:100%; scroll-snap-align:start; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:80px; position:relative;}
  .carousel .slide img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .dots{display:flex; gap:5px; justify-content:center; margin-top:10px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .dots span.on{background:var(--text);}
  .verified{display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--success); font-weight:700;}
  .link{color:var(--accent-dark); font-weight:700; cursor:pointer;}
  .center-col{display:flex; flex-direction:column; align-items:center; text-align:center;}
</style>
</head>
<body>
<noscript>
  <div style="max-width:420px;margin:15vh auto;padding:28px;font-family:-apple-system,sans-serif;text-align:center;background:#FBF4E7;color:#3E2A1B;border-radius:20px;">
    <div style="font-size:20px;font-weight:700;margin-bottom:10px;">This preview can't run Renté</div>

  </div>

<div id="root">
  <div id="app"></div>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-r="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-r="search" onclick="go('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Search</span>
    </button>
    <button class="tab plus" data-r="list-create" onclick="go('list-create')">
      <div class="plusdot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span>List</span>
    </button>
    <button class="tab" data-r="inbox" onclick="go('inbox')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Inbox</span>
    </button>
    <button class="tab" data-r="profile" onclick="go('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</div>

<script>

function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtKr(n){return Math.round(n).toLocaleString('sv-SE')+' kr';}
function daysBetween(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000));}
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function timeAgo(t){const s=(Date.now()-new Date(t))/1000; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';}
function stars(r){const f=Math.round(r); return '★'.repeat(f)+'☆'.repeat(5-f);}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200);}

function avatarColorFor(id){let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length];}

let storageOK=true;
function saveDB(){
  try{ localStorage.setItem(DB_KEY,JSON.stringify(db)); }
  catch(e){ if(storageOK){ storageOK=false; console.warn('Renté: local storage unavailable, changes will not persist.',e); } }
}
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw){db=JSON.parse(raw); return true;}
    return false;
  }catch(e){ storageOK=false; console.warn('Renté: local storage unavailable, starting a fresh in-memory session.',e); return false; }
}
function me(){return db.users[db.me];}
function unreadCount(){return db.notifications.filter(n=>!n.read).length;}

/* ===================== ROUTER ===================== */
function go(route,params){params=params||{}; state.history.push({route,params}); state.route=route; state.params=params; render();}
function back(){ if(state.history.length>1){state.history.pop(); const prev=state.history[state.history.length-1];} const prev=state.history.length?state.history[state.history.length-1]:{route:'home',params:{}}; state.route=prev.route; state.params=prev.params; render();}
function replace(route,params){params=params||{}; state.history[state.history.length-1]={route,params}; state.route=route; state.params=params; render();}

const TAB_ROUTES=['home','search','inbox','profile'];

function render(){
  const app=document.getElementById('app');
  const r=state.route,p=state.params;
  let html='';
  try{
    if(r==='onboarding') html=screenOnboarding();
    else if(r==='home') html=screenHome();
    else if(r==='search') html=screenSearch();
    else if(r==='item') html=screenItemDetail(p.id);
    else if(r==='booking') html=screenBooking(p.id,p.step||1);
    else if(r==='booking-detail') html=screenBookingDetail(p.id);
    else if(r==='list-create') html=screenListCreate();
    else if(r==='edit-item') html=screenEditItem(p.id);
    else if(r==='inbox') html=screenInbox();
    else if(r==='chat') html=screenChat(p.threadId);
    else if(r==='wallet') html=screenWallet();
    else if(r==='notifications') html=screenNotifications();
    else if(r==='favorites') html=screenFavorites();
    else if(r==='profile') html=screenProfile(p.userId||db.me);
    else if(r==='edit-profile') html=screenEditProfile();
    else html=screenHome();
  }catch(e){ html=`<div class="screen"><div class="empty"><span class="em">⚠️</span>Something went wrong.<br><small>${esc(e.message)}</small></div></div>`; console.error(e); }
  app.innerHTML=html;
  app.scrollTop=0;
  document.getElementById('tabbar').style.display=TAB_ROUTES.includes(r)?'flex':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.r===r));
}

/* ===================== SHARED PARTIALS ===================== */
function topbar(title,opts){opts=opts||{}; return `
  <div class="topbar">
    <button class="iconbtn" onclick="${opts.onBack||'back()'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>${esc(title)}</h1>
    ${opts.right||'<div style="width:36px"></div>'}
  </div>`;
}

function itemCardHtml(item){
  const owner=db.users[item.ownerId];
  const isFav=db.favorites.includes(item.id);
  const img=(item.images&&item.images[0]&&item.images[0]!=='placeholder')
    ? `<img src="${item.images[0]}">`
    : `<div style="position:absolute;inset:0;background:${placeholderGrad(item.category)};display:flex;align-items:center;justify-content:center;font-size:44px;">${catEmoji(item.category)}</div>`;
  return `
  <div class="card item-card" onclick="go('item',{id:'${item.id}'})">
    <div class="item-img">
      ${img}
      ${item.trending?'<span class="badge-trend">🔥 Trending</span>':''}
      <button class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event,'${item.id}')">♥</button>
    </div>
    <div class="item-info">
      <div class="item-title">${esc(item.title)}</div>
      <div class="item-meta">${esc(item.size)} · ${esc(item.condition)}</div>
      <div class="item-price"><b>${fmtKr(item.price)}</b>/day</div>
      <div class="item-owner">${avatarHtml(owner,16)} ${esc(owner.name.split(' ')[0])} <span class="stars">★</span> ${owner.ratingAvg.toFixed(1)}</div>
    </div>
  </div>`;
}
function toggleFav(ev,id){ev.stopPropagation(); const i=db.favorites.indexOf(id); if(i>-1)db.favorites.splice(i,1); else db.favorites.push(id); saveDB(); render();}

/* ===================== SEARCH ===================== */
function screenSearch(){
  if(state.params.cat) state.searchCat=state.params.cat;
  const q=(state.searchQ||'').toLowerCase();
  let results=Object.values(db.items);
  if(state.searchCat) results=results.filter(i=>i.category===state.searchCat);
  if(q) results=results.filter(i=> i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || (i.occasions||[]).some(o=>o.toLowerCase().includes(q)) );
  return `
  <div class="screen" style="padding-top:16px;">
    <div class="logo" style="font-size:20px;margin-bottom:14px;">Browse</div>
    <div class="searchbar" style="margin:0 0 14px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" placeholder="Search dresses, costumes, suits…" value="${esc(state.searchQ||'')}" oninput="onSearchInput(this.value)">
    </div>
    <div class="chips-row" style="margin-bottom:6px;">
      <div class="chip ${!state.searchCat?'active':''}" onclick="setCat(null)">All</div>
      ${CATS.map(c=>`<div class="chip ${state.searchCat===c.id?'active':''}" onclick="setCat('${c.id}')"><span class="em">${c.em}</span>${c.label}</div>`).join('')}
    </div>
    <div style="font-size:12.5px;color:var(--text-soft);margin:14px 0 10px;">${results.length} item${results.length===1?'':'s'} found</div>
    <div class="grid2">${results.map(itemCardHtml).join('')||'<div class="empty" style="grid-column:1/-1"><span class="em">🔍</span>No items match your search</div>'}</div>
  </div>`;
}
function onSearchInput(v){state.searchQ=v; render(); const inp=document.getElementById('search-input'); inp.focus(); inp.setSelectionRange(v.length,v.length);}
function setCat(c){state.searchCat=c; render();}

function confirmBooking(itemId){
  const item=db.items[itemId]; const d=state.bookingDraft; const days=daysBetween(d.start,d.end);
  const price=days*item.price; const spot=SPOTS.find(s=>s.id===d.spot);
  const bk={id:uid('bk'),itemId,renterId:db.me,ownerId:item.ownerId,status:'requested',start:d.start,end:d.end,meetup:spot.name,price,deposit:item.deposit,createdAt:new Date().toISOString(),returnPhotos:[]};
  db.bookings[bk.id]=bk;
  db.wallet.balance-=(price+item.deposit);
  db.wallet.transactions.push({id:uid('tx'),type:'rental_payment',amount:-price,desc:'Rental payment — '+item.title,time:new Date().toISOString()});
  db.wallet.transactions.push({id:uid('tx'),type:'deposit_hold',amount:-item.deposit,desc:'Deposit hold — '+item.title,time:new Date().toISOString()});
  db.notifications.unshift({id:uid('nt'),type:'booking',text:'Request sent to '+db.users[item.ownerId].name+' for '+item.title+'.',time:new Date().toISOString(),read:false,route:{r:'booking-detail',p:{id:bk.id}}});
  saveDB();
  setTimeout(()=>{ // simulate owner auto-accept
    const b=db.bookings[bk.id]; if(b&&b.status==='requested'){ b.status='confirmed';
      db.notifications.unshift({id:uid('nt'),type:'booking',text:db.users[item.ownerId].name+' confirmed your booking for '+item.title+'.',time:new Date().toISOString(),read:false,route:{r:'booking-detail',p:{id:bk.id}}});
      saveDB(); if(state.route==='booking-detail'&&state.params.id===bk.id) render();
    }
  },2000);
  state.bookingDraft=null;
  toast('Booking request sent!');
  go('booking-detail',{id:bk.id});
}

document.getElementById('hiddenCam').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file) return;
  fileToDataURL(file).then(url=>{
    if(state.camTarget==='listing'){ state.listDraft.images[state.listSlot]=url; render(); }
    else if(state.camTarget==='edititem'){ state.editDraft.images[state.listSlot]=url; render(); }
    else if(state.camTarget==='returnphoto'){ const b=db.bookings[state.camBookingId]; b.returnPhotos=b.returnPhotos||[]; b.returnPhotos.push(url); saveDB(); render(); }
    else if(state.camTarget==='avatar'){ state.profileDraft.avatarPhoto=url; render(); }
  });
  e.target.value='';
});
function fileToDataURL(file,maxDim,quality){
  maxDim=maxDim||1000; quality=quality||0.72;
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function openChatWith(otherId,itemId){
  const tid=threadIdFor(db.me,otherId,itemId);
  if(!db.messages[tid]) db.messages[tid]={id:tid,participants:[db.me,otherId],itemId,messages:[]};
  saveDB();
  go('chat',{threadId:tid});
}
function screenInbox(){
  const threads=Object.values(db.messages).sort((a,b)=>{
    const la=a.messages[a.messages.length-1], lb=b.messages[b.messages.length-1];
    return new Date((lb&&lb.time)||0)-new Date((la&&la.time)||0);
  });
  return `
  <div class="screen" style="padding-top:16px;">
    <div class="logo" style="font-size:20px;margin-bottom:16px;">Messages</div>
    ${threads.length?threads.map(t=>{
      const otherId=t.participants.find(p=>p!==db.me); const other=db.users[otherId];
      const last=t.messages[t.messages.length-1];
      const item=db.items[t.itemId];
      return `<div class="list-row" style="border-bottom:1px solid var(--line);" onclick="go('chat',{threadId:'${t.id}'})">
        ${avatarHtml(other,46)}
        <div class="rowinfo">
          <div style="display:flex;justify-content:space-between;"><b style="font-size:14px;">${esc(other.name)}</b><span style="font-size:11px;color:var(--text-faint);">${last?timeAgo(last.time):''}</span></div>
          <div style="font-size:12.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item?'Re: '+esc(item.title)+' · ':''}${last?esc(last.text):'Say hi 👋'}</div>
        </div>
      </div>`;
    }).join(''):`<div class="empty"><span class="em">💬</span>No messages yet.<br>Message an owner from any item page.</div>`}
  </div>`;
}
const CANNED=[
  {kw:['size','fit'],reply:"Sure! It runs true to size, but message me your measurements if you want to double check 🙂"},
  {kw:['pickup','meet','where'],reply:"Works for me! Let's confirm the exact time once the booking is set."},
  {kw:['condition','damage','clean'],reply:"It's in the condition described in the listing — freshly cleaned before every rental."},
  {kw:['price','deposit','cost'],reply:"Price and deposit are listed on the item page — the deposit is fully refunded after return!"},
  {kw:['hi','hej','hello'],reply:"Hej! Thanks for reaching out 😊 let me know what you'd like to know."},
];
function screenChat(threadId){
  const t=db.messages[threadId]; if(!t) return `<div class="screen">${topbar('Chat')}<div class="empty">Conversation not found</div></div>`;
  const otherId=t.participants.find(p=>p!==db.me); const other=db.users[otherId]; const item=db.items[t.itemId];
  return `
  ${topbar(other.name,{right:`<div style="width:36px"></div>`})}
  ${item?`<div class="card list-row" style="margin:12px 18px 0;" onclick="go('item',{id:'${item.id}'})"><div class="item-img" style="width:40px;height:40px;border-radius:10px;background:${placeholderGrad(item.category)};font-size:18px;">${catEmoji(item.category)}</div><div class="rowinfo" style="font-size:12.5px;"><b>${esc(item.title)}</b><div style="color:var(--text-soft);">${fmtKr(item.price)}/day</div></div></div>`:''}
  <div class="screen" style="padding-top:14px;padding-bottom:6px;" id="chat-scroll">
    ${t.messages.length?t.messages.map(m=>`<div><div class="msg-bubble ${m.from===db.me?'msg-me':'msg-them'}">${esc(m.text)}</div><div class="msg-time">${timeAgo(m.time)}</div></div>`).join(''):`<div class="empty"><span class="em">👋</span>Say hi to ${esc(other.name.split(' ')[0])}</div>`}
  </div>
  <div class="chatbar">
    <input id="chat-input" placeholder="Message about sizing, pickup…" onkeydown="if(event.key==='Enter')sendMsg('${threadId}')">
    <button onclick="sendMsg('${threadId}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
  </div>`;
}
function sendMsg(threadId){
  const inp=document.getElementById('chat-input'); const text=inp.value.trim(); if(!text) return;
  const t=db.messages[threadId]; t.messages.push({from:db.me,text,time:new Date().toISOString()});
  saveDB(); inp.value=''; render(); scrollChatBottom();
  const otherId=t.participants.find(p=>p!==db.me);
  setTimeout(()=>{
    const low=text.toLowerCase(); let reply=CANNED.find(c=>c.kw.some(k=>low.includes(k)));
    const txt=reply?reply.reply:"Got it, thanks for the message! 🙌";
    t.messages.push({from:otherId,text:txt,time:new Date().toISOString()});
    db.notifications.unshift({id:uid('nt'),type:'message',text:db.users[otherId].name+': '+txt,time:new Date().toISOString(),read:false,route:{r:'chat',p:{threadId}}});
    saveDB();
    if(state.route==='chat'&&state.params.threadId===threadId){render(); scrollChatBottom();}
  },1300);
}
function scrollChatBottom(){const el=document.getElementById('chat-scroll'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'end'}); const app=document.getElementById('app'); if(app) app.scrollTop=app.scrollHeight;}

/* ===================== WALLET ===================== */
function screenWallet(){
  const txs=db.wallet.transactions.slice().sort((a,b)=>new Date(b.time)-new Date(a.time));
  const icon={bonus:'🎁',rental_payment:'👗',deposit_hold:'🔒',deposit_refund:'↩️',refund:'↩️',earning:'💰',topup:'⬆️',deposit_refund_out:'✅'};
  return `
  ${topbar('Wallet')}
  <div class="screen">
    <div class="card" style="padding:22px;text-align:center;background:var(--beige);border:none;margin-bottom:18px;">
      <div style="font-size:12.5px;color:var(--text-soft);margin-bottom:6px;">Available balance</div>
      <div style="font-size:34px;font-weight:800;">${fmtKr(db.wallet.balance)}</div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-primary btn-sm" onclick="topUp()">Top up</button>
        <button class="btn btn-outline btn-sm" onclick="withdraw()">Withdraw</button>
      </div>
    </div>
    <div class="section-title" style="margin-top:0;"><h2>Transaction history</h2></div>
    ${txs.length?txs.map(t=>`
      <div class="list-row" style="border-bottom:1px solid var(--line);padding-left:0;padding-right:0;">
        <div class="notif-row" style="padding:0;border:none;"><div class="em">${icon[t.type]||'💳'}</div></div>
        <div class="rowinfo"><div style="font-size:13.5px;font-weight:600;">${esc(t.desc)}</div><div style="font-size:11.5px;color:var(--text-faint);">${timeAgo(t.time)}</div></div>
        <div style="font-weight:700;color:${t.amount<0?'var(--danger)':'var(--success)'};font-size:14px;">${t.amount<0?'−':'+'}${fmtKr(Math.abs(t.amount))}</div>
      </div>`).join(''):'<div class="empty">No transactions yet</div>'}
  </div>`;
}
function topUp(){db.wallet.balance+=500; db.wallet.transactions.push({id:uid('tx'),type:'topup',amount:500,desc:'Wallet top-up',time:new Date().toISOString()}); saveDB(); toast('Added 500 kr'); render();}
function withdraw(){const amt=Math.min(200,db.wallet.balance); if(amt<=0){toast('Nothing to withdraw'); return;} db.wallet.balance-=amt; db.wallet.transactions.push({id:uid('tx'),type:'withdraw',amount:-amt,desc:'Withdrawal to bank',time:new Date().toISOString()}); saveDB(); toast('Withdrew '+fmtKr(amt)); render();}

/* ===================== NOTIFICATIONS ===================== */
function screenNotifications(){
  const icon={system:'✨',booking:'📦',payment:'💰',message:'💬'};
  return `
  ${topbar('Notifications')}
  <div class="screen">
    ${db.notifications.length?db.notifications.map(n=>`
      <div class="notif-row ${!n.read?'unread':''}" onclick="openNotif('${n.id}')">
        <div class="em">${icon[n.type]||'🔔'}</div>
        <div class="rowinfo"><div style="font-size:13.5px;">${esc(n.text)}</div><div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">${timeAgo(n.time)}</div></div>
      </div>`).join(''):'<div class="empty"><span class="em">🔔</span>No notifications yet</div>'}
  </div>`;
}
function openNotif(id){const n=db.notifications.find(x=>x.id===id); if(!n) return; n.read=true; saveDB(); if(n.route) go(n.route.r,n.route.p); else render();}

/* ===================== FAVORITES ===================== */
function screenFavorites(){
  const items=db.favorites.map(id=>db.items[id]).filter(Boolean);
  return `
  ${topbar('Favorites')}
  <div class="screen">
    <div class="grid2">${items.map(itemCardHtml).join('')||'<div class="empty" style="grid-column:1/-1"><span class="em">♥</span>No favorites yet — tap the heart on any item.</div>'}</div>
  </div>`;
}

/* ===================== PROFILE ===================== */
function screenProfile(userId){
  state.profileDraft=null;
  const u=db.users[userId]; const isMe=userId===db.me;
  const myItems=Object.values(db.items).filter(i=>i.ownerId===userId);
  const renting=Object.values(db.bookings).filter(b=>b.renterId===db.me);
  const lending=Object.values(db.bookings).filter(b=>b.ownerId===db.me);
  const revs=(db.reviews[userId]||[]).slice().reverse();
  const tab=state.params.tab||'listings';
  let content='';
  if(!isMe){
    content=`<div class="grid2">${myItems.map(itemCardHtml).join('')||'<div class="empty" style="grid-column:1/-1">No active listings</div>'}</div>`;
  } else {
    content=`
    <div class="profile-tabs">
      <button class="${tab==='listings'?'active':''}" onclick="go('profile',{userId:'${userId}',tab:'listings'})">Listings</button>
      <button class="${tab==='renting'?'active':''}" onclick="go('profile',{userId:'${userId}',tab:'renting'})">Renting</button>
      <button class="${tab==='lending'?'active':''}" onclick="go('profile',{userId:'${userId}',tab:'lending'})">Lending</button>
      <button class="${tab==='reviews'?'active':''}" onclick="go('profile',{userId:'${userId}',tab:'reviews'})">Reviews</button>
    </div>
    ${tab==='listings'?`<div class="grid2">${myItems.map(itemCardHtml).join('')||'<div class="empty" style="grid-column:1/-1">You haven&#39;t listed anything yet.<br><span class="link" onclick="go(&#39;list-create&#39;)">List your first item →</span></div>'}</div>`:''}
    ${tab==='renting'?bookingList(renting,false):''}
    ${tab==='lending'?bookingList(lending,true):''}
    ${tab==='reviews'?(revs.length?revs.map(r=>`<div class="review"><div class="review-head">${avatarHtml(db.users[r.from]||{id:r.from,name:'?'},28)}<b style="font-size:13px;">${esc((db.users[r.from]||{}).name||'Student')}</b><span class="stars">${stars(r.rating)}</span></div><div style="font-size:13px;color:var(--text-soft);">${esc(r.text)}</div></div>`).join(''):'<div class="empty">No reviews yet</div>'):''}
    `;
  }
  return `
  ${topbar(isMe?'My Profile':u.name,{right:isMe?`<button class="iconbtn" onclick="go('edit-profile')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`:'<div style="width:36px"></div>'})}
  <div class="screen">
    <div class="center-col" style="margin-bottom:18px;">
      ${avatarHtml(u,74)}
      <div style="font-size:18px;font-weight:800;margin-top:10px;">${esc(u.name)} ${u.verified?'<span class="verified">✓ JU verified</span>':''}</div>
      <div style="font-size:13px;color:var(--text-soft);">${esc(u.program)}</div>
      <div class="stars" style="margin-top:6px;">${stars(u.ratingAvg)} <span style="color:var(--text-soft);">${u.ratingAvg.toFixed(1)} (${u.ratingCount})</span></div>
      <p style="font-size:13px;color:var(--text-soft);max-width:280px;margin-top:10px;">${esc(u.bio)}</p>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:6px;">
      <div class="stat-box"><b>${myItems.length}</b><span>Listed</span></div>
      <div class="stat-box"><b>${Object.values(db.bookings).filter(b=>(b.ownerId===userId||b.renterId===userId)&&b.status==='completed').length}</b><span>Completed</span></div>
      <div class="stat-box"><b>${new Date(u.joined).getFullYear()}</b><span>Member since</span></div>
    </div>
    ${isMe?`<div class="card list-row" style="margin-top:16px;" onclick="go('wallet')"><div class="item-img" style="width:44px;height:44px;border-radius:12px;background:var(--beige);font-size:20px;">💳</div><div class="rowinfo"><b>${fmtKr(db.wallet.balance)}</b><div style="font-size:12px;color:var(--text-soft);">Wallet balance — tap to view</div></div></div>`:`<button class="btn btn-primary" style="margin-top:16px;" onclick="openChatWith('${u.id}','')">💬 Message ${esc(u.name.split(' ')[0])}</button>`}
    ${content}
    ${isMe?`<div class="divider"></div><button class="btn btn-outline" onclick="resetDemo()">Reset demo data</button>`:''}
  </div>`;
}
function bookingList(list,isOwnerView){
  if(!list.length) return '<div class="empty">Nothing here yet</div>';
  const statusLabel={requested:'Requested',confirmed:'Confirmed',active:'Active',return_pending:'Awaiting confirmation',completed:'Completed',declined:'Declined',cancelled:'Cancelled'};
  return list.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(b=>{
    const item=db.items[b.itemId]; if(!item) return '';
    const other=db.users[isOwnerView?b.renterId:b.ownerId];
    return `<div class="card list-row" style="margin-bottom:10px;" onclick="go('booking-detail',{id:'${b.id}'})">
      <div class="item-img" style="width:50px;height:50px;border-radius:12px;background:${placeholderGrad(item.category)};font-size:22px;">${(item.images&&item.images[0]!=='placeholder')?`<img src="${item.images[0]}">`:catEmoji(item.category)}</div>
      <div class="rowinfo"><div class="item-title">${esc(item.title)}</div><div class="item-meta">${isOwnerView?'Renter':'Owner'}: ${esc(other.name.split(' ')[0])} · ${fmtDate(b.start)}</div><span class="pill status-${b.status}" style="margin-top:4px;">${statusLabel[b.status]}</span></div>
    </div>`;
  }).join('');
}
function resetDemo(){ if(confirm('This clears all local demo data on this device. Continue?')){ localStorage.removeItem(DB_KEY); location.reload(); } }

/* ===================== EDIT PROFILE ===================== */
function screenEditProfile(){
  const u=me();
  if(!state.profileDraft) state.profileDraft={name:u.name,program:u.program,email:u.email||'',bio:u.bio,avatarPhoto:u.avatarPhoto||null};
  const d=state.profileDraft;
  return `
  ${topbar('Edit profile')}
  <div class="screen">
    <div class="center-col" style="margin-bottom:18px;">
      <div style="position:relative;">${avatarHtml({id:u.id,name:d.name,color:u.color,avatarPhoto:d.avatarPhoto},84)}<button class="iconbtn" style="position:absolute;bottom:-2px;right:-2px;background:var(--text);color:var(--bg);" onclick="state.camTarget='avatar';document.getElementById('hiddenCam').click();">📷</button></div>
    </div>
    <div class="field"><label>Full name</label><input type="text" id="e-name" value="${esc(d.name)}" oninput="state.profileDraft.name=this.value"></div>
    <div class="field"><label>Program</label><input type="text" id="e-program" value="${esc(d.program)}" oninput="state.profileDraft.program=this.value"></div>
    <div class="field"><label>University email</label><input type="email" id="e-email" value="${esc(d.email)}" placeholder="you@ju.se" oninput="state.profileDraft.email=this.value"></div>
    <div class="field"><label>Bio</label><textarea id="e-bio" oninput="state.profileDraft.bio=this.value">${esc(d.bio)}</textarea></div>
    <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
  </div>`;
}
function saveProfile(){
  const u=me(); const d=state.profileDraft;
  u.name=d.name.trim()||u.name;
  u.program=d.program.trim()||u.program;
  u.email=d.email.trim();
  u.verified=!!(u.email&&u.email.includes('ju.se'));
  u.bio=d.bio.trim();
  u.avatarPhoto=d.avatarPhoto;
  state.profileDraft=null;
  saveDB(); toast('Profile updated'); go('profile',{userId:db.me});
}

document.getElementById('appleTouchIcon').href=LOGO_URI;
if(loadDB()){ go('home'); } else { render(); }
if(!storageOK){ setTimeout(()=>toast('Note: this browser is blocking saved data — your changes won\'t persist after closing.'),1200); }
</script>
